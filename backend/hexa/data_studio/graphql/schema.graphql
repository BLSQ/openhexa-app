"""
A SQL query saved by a user in the Data Studio. Saved queries belong to a
workspace and are visible to all of its members.
"""
type SavedQuery {
  id: ID!
  name: String!
  "Workspace-unique, URL-friendly identifier used to execute the query by slug."
  slug: String!
  description: String
  content: String!
  "Whether the query can be executed anonymously (via executePublicSavedQuery)."
  isPublic: Boolean!
  "Declared parameter spec driving the query's Jinja template."
  parameters: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: User
  workspace: Workspace!
  permissions: SavedQueryPermissions!
}

"""
Permissions of a saved query.
"""
type SavedQueryPermissions {
  "Permission to edit the saved query."
  update: Boolean!
  "Permission to delete the saved query."
  delete: Boolean!
  "Permission to execute the saved query against the workspace database."
  run: Boolean!
  "Permission to publish (make public) the saved query."
  publish: Boolean!
}

"""
A page of saved queries.
"""
type SavedQueryPage {
  totalPages: Int!
  totalItems: Int!
  pageNumber: Int!
  items: [SavedQuery!]!
}

extend type Workspace {
  "The saved queries of the workspace."
  savedQueries(query: String, page: Int = 1, perPage: Int = 15): SavedQueryPage!
}

extend type WorkspacePermissions {
  "Permission to create a saved query in the workspace."
  createSavedQuery: Boolean!
}

extend type Query {
  "Retrieves a saved query by its id. When a workspace slug is given, the lookup is scoped to that workspace."
  savedQuery(id: ID!, workspaceSlug: String): SavedQuery
}

"""
Input for creating a saved query.
"""
input CreateSavedQueryInput {
  workspaceSlug: String!
  name: String!
  content: String!
  description: String
  parameters: JSON
  isPublic: Boolean
}

"""
Errors that can occur when creating a saved query.
"""
enum CreateSavedQueryError {
  WORKSPACE_NOT_FOUND
  PERMISSION_DENIED
  INVALID_PARAMETERS
}

"""
Result of creating a saved query.
"""
type CreateSavedQueryResult {
  savedQuery: SavedQuery
  success: Boolean!
  errors: [CreateSavedQueryError!]!
}

"""
Input for updating a saved query.
"""
input UpdateSavedQueryInput {
  id: ID!
  name: String
  content: String
  description: String
  parameters: JSON
  isPublic: Boolean
}

"""
Errors that can occur when updating a saved query.
"""
enum UpdateSavedQueryError {
  SAVED_QUERY_NOT_FOUND
  PERMISSION_DENIED
  INVALID_PARAMETERS
}

"""
Result of updating a saved query.
"""
type UpdateSavedQueryResult {
  savedQuery: SavedQuery
  success: Boolean!
  errors: [UpdateSavedQueryError!]!
}

"""
Input for deleting a saved query.
"""
input DeleteSavedQueryInput {
  id: ID!
}

"""
Errors that can occur when deleting a saved query.
"""
enum DeleteSavedQueryError {
  SAVED_QUERY_NOT_FOUND
  PERMISSION_DENIED
}

"""
Result of deleting a saved query.
"""
type DeleteSavedQueryResult {
  success: Boolean!
  errors: [DeleteSavedQueryError!]!
}

"""
Errors that can occur when executing a saved query.
"""
enum ExecuteSavedQueryError {
  "The saved query does not exist or is not accessible to the caller."
  SAVED_QUERY_NOT_FOUND
  "The caller is not allowed to run this saved query."
  PERMISSION_DENIED
  "The supplied parameters do not satisfy the query's declared spec."
  INVALID_PARAMETERS
  "The query template could not be rendered."
  TEMPLATE_ERROR
  "The query was cancelled because it exceeded the statement timeout."
  QUERY_TIMEOUT
  "The query could not be executed (e.g. invalid SQL or a disallowed operation)."
  QUERY_ERROR
  "The rendered query contained more than one SQL statement."
  MULTIPLE_STATEMENTS
  "Too many anonymous executions from this caller; retry later."
  RATE_LIMITED
}

"""
Result of executing a saved query. Mirrors ExecuteSQLResult, with a broader
error set covering parameter and template failures.
"""
type ExecuteSavedQueryResult {
  success: Boolean!
  errors: [ExecuteSavedQueryError!]!
  "The underlying error message, when the query failed."
  errorMessage: String
  "The names of the columns returned by the query."
  columns: [String!]
  "The rows returned by the query, each a JSON object keyed by column name."
  rows: [JSON!]
  "The number of rows returned (after any truncation)."
  rowCount: Int
  "Whether the result was truncated because it exceeded the maximum number of rows."
  truncated: Boolean
  "The server-side execution time of the query, in milliseconds."
  durationMs: Int
}

"""
Input for executing a saved query by slug.
"""
input ExecuteSavedQueryInput {
  workspaceSlug: String!
  slug: String!
  "Values for the query's declared parameters, keyed by parameter name."
  parameters: JSON
  maxRows: Int
}

extend type Mutation {
  "Creates a new saved query in a workspace."
  createSavedQuery(input: CreateSavedQueryInput!): CreateSavedQueryResult! @loginRequired
  "Updates an existing saved query."
  updateSavedQuery(input: UpdateSavedQueryInput!): UpdateSavedQueryResult! @loginRequired
  "Deletes a saved query."
  deleteSavedQuery(input: DeleteSavedQueryInput!): DeleteSavedQueryResult! @loginRequired
  "Executes a saved query by slug, with optional templated parameters."
  executeSavedQuery(input: ExecuteSavedQueryInput!): ExecuteSavedQueryResult! @loginRequired
  """
  Executes a *public* saved query by slug, without authentication. Only queries
  flagged isPublic can be run this way; anything else resolves to
  SAVED_QUERY_NOT_FOUND. Subject to a stricter row cap and rate limiting.
  """
  executePublicSavedQuery(input: ExecuteSavedQueryInput!): ExecuteSavedQueryResult!
}
