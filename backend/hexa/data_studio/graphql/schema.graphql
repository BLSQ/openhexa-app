"""
A SQL query saved by a user in the Data Studio. Saved queries belong to a
workspace and are visible to all of its members.
"""
type SavedQuery {
  id: ID!
  "Stable identifier, unique within the workspace. Generated from the name and left unchanged when the query is renamed."
  slug: String!
  name: String!
  description: String
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: User
  workspace: Workspace!
  permissions: SavedQueryPermissions!
}

"""
Permissions of a saved query.
"""
type SavedQueryPermissions {
  "Permission to edit the saved query."
  update: Boolean!
  "Permission to delete the saved query."
  delete: Boolean!
}

"""
A page of saved queries.
"""
type SavedQueryPage {
  totalPages: Int!
  totalItems: Int!
  pageNumber: Int!
  items: [SavedQuery!]!
}

"""
Enum representing the possible orderings for saved queries.
"""
enum SavedQueryOrderBy {
  NAME_ASC
  NAME_DESC
  UPDATED_AT_ASC
  UPDATED_AT_DESC
}

extend type Workspace {
  "The saved queries of the workspace."
  savedQueries(query: String, page: Int = 1, perPage: Int = 15, orderBy: SavedQueryOrderBy! = UPDATED_AT_DESC): SavedQueryPage!
}

extend type WorkspacePermissions {
  "Permission to create a saved query in the workspace."
  createSavedQuery: Boolean!
}

extend type Query {
  "Retrieves a saved query by its id. When a workspace slug is given, the lookup is scoped to that workspace."
  savedQuery(id: ID!, workspaceSlug: String): SavedQuery
  "Retrieves a saved query by its slug within a workspace."
  savedQueryBySlug(workspaceSlug: String!, slug: String!): SavedQuery
  "Runs a saved query against the workspace database and returns its result, without exposing the SQL."
  executeSavedQuery(input: ExecuteSavedQueryInput!): ExecuteSavedQueryResult! @loginRequired
}

"""
Input for executing a saved query.
"""
input ExecuteSavedQueryInput {
  workspaceSlug: String!
  slug: String!
  "Caps the number of returned rows; defaults to 50 and is itself capped to a server-side hard limit."
  maxRows: Int
}

"""
Errors that can occur when executing a saved query.
"""
enum ExecuteSavedQueryError {
  "No saved query with this slug in this workspace, or the workspace is not visible to the caller."
  NOT_FOUND
  "The caller is not allowed to run queries against this workspace database."
  PERMISSION_DENIED
  "The query was cancelled because it exceeded the statement timeout."
  QUERY_TIMEOUT
  "The query could not be executed (e.g. the schema changed since it was saved)."
  QUERY_ERROR
  "The stored query holds more than one SQL statement; only a single statement is allowed."
  MULTIPLE_STATEMENTS
}

"""
Result of executing a saved query. Mirrors ExecuteSQLResult, without ever
exposing the SQL that was run.
"""
type ExecuteSavedQueryResult {
  success: Boolean!
  errors: [ExecuteSavedQueryError!]!
  "The underlying database error message, when the query failed."
  errorMessage: String
  columns: [String!]
  "The rows returned by the query, each one a JSON object keyed by column name."
  rows: [JSON!]
  rowCount: Int
  "Whether the result was truncated because it exceeded the maximum number of rows."
  truncated: Boolean
  "The server-side execution time of the query, in milliseconds."
  durationMs: Int
}

"""
Input for creating a saved query.
"""
input CreateSavedQueryInput {
  workspaceSlug: String!
  name: String!
  content: String!
  description: String
}

"""
Errors that can occur when creating a saved query.
"""
enum CreateSavedQueryError {
  WORKSPACE_NOT_FOUND
  PERMISSION_DENIED
}

"""
Result of creating a saved query.
"""
type CreateSavedQueryResult {
  savedQuery: SavedQuery
  success: Boolean!
  errors: [CreateSavedQueryError!]!
}

"""
Input for updating a saved query.
"""
input UpdateSavedQueryInput {
  id: ID!
  name: String
  content: String
  description: String
}

"""
Errors that can occur when updating a saved query.
"""
enum UpdateSavedQueryError {
  SAVED_QUERY_NOT_FOUND
  PERMISSION_DENIED
}

"""
Result of updating a saved query.
"""
type UpdateSavedQueryResult {
  savedQuery: SavedQuery
  success: Boolean!
  errors: [UpdateSavedQueryError!]!
}

"""
Input for deleting a saved query.
"""
input DeleteSavedQueryInput {
  id: ID!
}

"""
Errors that can occur when deleting a saved query.
"""
enum DeleteSavedQueryError {
  SAVED_QUERY_NOT_FOUND
  PERMISSION_DENIED
}

"""
Result of deleting a saved query.
"""
type DeleteSavedQueryResult {
  success: Boolean!
  errors: [DeleteSavedQueryError!]!
}

extend type Mutation {
  "Creates a new saved query in a workspace."
  createSavedQuery(input: CreateSavedQueryInput!): CreateSavedQueryResult! @loginRequired
  "Updates an existing saved query."
  updateSavedQuery(input: UpdateSavedQueryInput!): UpdateSavedQueryResult! @loginRequired
  "Deletes a saved query."
  deleteSavedQuery(input: DeleteSavedQueryInput!): DeleteSavedQueryResult! @loginRequired
}
