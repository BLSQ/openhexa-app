# Running SQL against a workspace database. The 'Database' type itself is defined by
# the databases app; the Data Studio owns the execution path because it also owns the
# audit log ('QueryLog') that every execution writes to.
extend type Database {
  """
  Runs a read-only SQL query against the workspace database and returns the result.
  `maxRows` caps the number of returned rows; it defaults to 50 when omitted and is
  itself capped to a server-side hard limit. `origin` identifies where the query comes
  from for auditing purposes; it defaults to OTHER.
  """
  executeSQL(query: String!, maxRows: Int, origin: ExecuteSQLOrigin): ExecuteSQLResult!
}

"""
The origin of a SQL query, recorded for auditing and to build a per-user query history.
"""
enum ExecuteSQLOrigin {
  """
  The client did not identify where the query comes from.
  """
  OTHER

  """
  The query originates from the Data Studio frontend.
  """
  DATA_STUDIO
}

"""
Possible errors when executing a SQL query against the workspace database.
"""
enum ExecuteSQLError {
  """
  The user is not allowed to run queries against this workspace database.
  """
  PERMISSION_DENIED

  """
  The query was cancelled because it exceeded the statement timeout.
  """
  QUERY_TIMEOUT

  """
  The query could not be executed (e.g. invalid SQL or a disallowed operation).
  """
  QUERY_ERROR

  """
  More than one SQL statement was submitted; only a single statement is allowed.
  """
  MULTIPLE_STATEMENTS
}

"""
Represents the result of executing a SQL query against the workspace database.
"""
type ExecuteSQLResult {
  """
  Indicates whether the query executed successfully.
  """
  success: Boolean!

  """
  The errors that occurred while executing the query.
  """
  errors: [ExecuteSQLError!]!

  """
  The underlying database error message, when the query failed.
  """
  errorMessage: String

  """
  The names of the columns returned by the query.
  """
  columns: [String!]

  """
  The rows returned by the query, each one a JSON object keyed by column name.
  """
  rows: [JSON!]

  """
  The number of rows returned by the query (after any truncation).
  """
  rowCount: Int

  """
  Whether the result was truncated because it exceeded the maximum number of rows.
  """
  truncated: Boolean

  """
  The server-side execution time of the query, in milliseconds.
  """
  durationMs: Int
}

"""
Who a saved query is visible to within its workspace.
"""
enum SavedQueryVisibility {
  "Only the author can see, run and edit the query."
  PRIVATE
  "Every member of the workspace can see and run the query."
  WORKSPACE
}

"""
A SQL query saved by a user in the Data Studio. Saved queries belong to a
workspace; their visibility decides which of its members can reach them.
"""
type SavedQuery {
  id: ID!
  "Stable identifier, unique within the workspace. Generated from the name and left unchanged when the query is renamed."
  slug: String!
  name: String!
  description: String
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: User
  workspace: Workspace!
  visibility: SavedQueryVisibility!
  permissions: SavedQueryPermissions!
}

# Saved queries record a version of their SQL on every save (see the app README), but
# nothing here exposes that history yet: the fields to read it land with the UI that
# browses it, so their shape can be settled by what that UI actually needs. The model
# already answers `get_versions`, `get_version_content` and `get_commit_diff`.

"""
Permissions of a saved query.
"""
type SavedQueryPermissions {
  "Permission to edit the saved query."
  update: Boolean!
  "Permission to delete the saved query."
  delete: Boolean!
  "Permission to share or unshare the saved query."
  updateVisibility: Boolean!
}

"""
A page of saved queries.
"""
type SavedQueryPage {
  totalPages: Int!
  totalItems: Int!
  pageNumber: Int!
  items: [SavedQuery!]!
}

"""
Enum representing the possible orderings for saved queries.
"""
enum SavedQueryOrderBy {
  NAME_ASC
  NAME_DESC
  UPDATED_AT_ASC
  UPDATED_AT_DESC
}

extend type Workspace {
  "The saved queries of the workspace."
  savedQueries(query: String, page: Int = 1, perPage: Int = 15, orderBy: SavedQueryOrderBy! = UPDATED_AT_DESC): SavedQueryPage!
}

extend type WorkspacePermissions {
  "Permission to create a saved query in the workspace."
  createSavedQuery: Boolean!
}

extend type Query {
  "Retrieves a saved query by its id. When a workspace slug is given, the lookup is scoped to that workspace."
  savedQuery(id: ID!, workspaceSlug: String): SavedQuery
  "Retrieves a saved query by its slug, which is unique across workspaces."
  savedQueryBySlug(slug: String!): SavedQuery
  "Runs a saved query against the workspace database and returns its result, without exposing the SQL."
  executeSavedQuery(input: ExecuteSavedQueryInput!): ExecuteSQLResult! @loginRequired
}

"""
Input for executing a saved query.
"""
input ExecuteSavedQueryInput {
  slug: String!
  "Caps the number of returned rows; defaults to 50 and is itself capped to a server-side hard limit."
  maxRows: Int
}

# executeSavedQuery returns the same payload as executeSQL -- the two differ in
# what they accept, not in what a result looks like -- so it reuses that type
# rather than declaring a twin of it. Addressing a query by slug is the one
# failure the shared enum did not cover; it is named for its endpoint since
# executeSQL can never return it.
extend enum ExecuteSQLError {
  "No saved query with this slug, or it is not visible to the caller."
  SAVED_QUERY_NOT_FOUND
}

"""
Input for creating a saved query.
"""
input CreateSavedQueryInput {
  workspaceSlug: String!
  name: String!
  content: String!
  description: String
  "Defaults to PRIVATE when omitted."
  visibility: SavedQueryVisibility
}

"""
Errors that can occur when creating a saved query.
"""
enum CreateSavedQueryError {
  WORKSPACE_NOT_FOUND
  PERMISSION_DENIED
  "The query's history could not be recorded, so nothing was saved. Retrying is safe."
  VERSIONING_UNAVAILABLE
}

"""
Result of creating a saved query.
"""
type CreateSavedQueryResult {
  savedQuery: SavedQuery
  success: Boolean!
  errors: [CreateSavedQueryError!]!
}

"""
Input for updating a saved query.
"""
input UpdateSavedQueryInput {
  id: ID!
  name: String
  content: String
  description: String
  "Only the author may change this; PERMISSION_DENIED otherwise."
  visibility: SavedQueryVisibility
  """
  The version this edit was made against. When given, the edit is refused with
  VERSION_CONFLICT if someone else has saved the query since. Omit it to overwrite
  whatever is there, which is all a client that never read a version can honestly ask
  for.
  """
  expectedVersion: String
}

"""
Errors that can occur when updating a saved query.
"""
enum UpdateSavedQueryError {
  SAVED_QUERY_NOT_FOUND
  PERMISSION_DENIED
  "The new version could not be recorded, so no change was saved. Retrying is safe."
  VERSIONING_UNAVAILABLE
  """
  Someone else saved the query after the version this edit was made against, so
  nothing was written. Retrying as-is would overwrite their change: reload first.
  """
  VERSION_CONFLICT
}

"""
Result of updating a saved query.
"""
type UpdateSavedQueryResult {
  savedQuery: SavedQuery
  success: Boolean!
  errors: [UpdateSavedQueryError!]!
}

"""
Input for deleting a saved query.
"""
input DeleteSavedQueryInput {
  id: ID!
}

"""
Errors that can occur when deleting a saved query.
"""
enum DeleteSavedQueryError {
  SAVED_QUERY_NOT_FOUND
  PERMISSION_DENIED
  "The query's history could not be archived, so the query was not deleted. Retrying is safe."
  VERSIONING_UNAVAILABLE
}

"""
Result of deleting a saved query.
"""
type DeleteSavedQueryResult {
  success: Boolean!
  errors: [DeleteSavedQueryError!]!
}

extend type Mutation {
  "Creates a new saved query in a workspace."
  createSavedQuery(input: CreateSavedQueryInput!): CreateSavedQueryResult! @loginRequired
  "Updates an existing saved query."
  updateSavedQuery(input: UpdateSavedQueryInput!): UpdateSavedQueryResult! @loginRequired
  "Deletes a saved query."
  deleteSavedQuery(input: DeleteSavedQueryInput!): DeleteSavedQueryResult! @loginRequired
}
