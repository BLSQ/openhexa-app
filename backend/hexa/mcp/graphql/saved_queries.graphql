fragment SavedQuerySummary on SavedQuery {
  id
  slug
  name
  description
  visibility
  createdAt
  updatedAt
  createdBy {
    displayName
  }
}

fragment SavedQueryDetail on SavedQuery {
  ...SavedQuerySummary
  content
  parameters {
    name
    type
    multiple
    required
    default
    help
  }
}

query ListSavedQueries($workspaceSlug: String!, $query: String, $page: Int, $perPage: Int) {
  workspace(slug: $workspaceSlug) {
    savedQueries(query: $query, page: $page, perPage: $perPage) {
      pageNumber
      totalPages
      totalItems
      items {
        ...SavedQuerySummary
      }
    }
  }
}

mutation CreateSavedQuery($input: CreateSavedQueryInput!) {
  createSavedQuery(input: $input) {
    success
    errors
    savedQuery {
      ...SavedQueryDetail
    }
  }
}

mutation UpdateSavedQuery($input: UpdateSavedQueryInput!) {
  updateSavedQuery(input: $input) {
    success
    errors
    savedQuery {
      ...SavedQueryDetail
    }
  }
}

query GetSavedQuery($slug: String!) {
  savedQueryBySlug(slug: $slug) {
    ...SavedQueryDetail
    workspace {
      slug
    }
  }
}
