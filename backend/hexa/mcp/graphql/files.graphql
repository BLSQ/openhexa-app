query ListFiles($workspaceSlug: String!, $prefix: String, $page: Int, $perPage: Int) {
  workspace(slug: $workspaceSlug) {
    bucket {
      objects(prefix: $prefix, page: $page, perPage: $perPage, ignoreHiddenFiles: false) {
        hasNextPage
        hasPreviousPage
        pageNumber
        items {
          name
          key
          type
          size
          updatedAt
        }
      }
    }
  }
}

query ReadFileContent($workspaceSlug: String!, $filePath: String!, $startLine: Int, $endLine: Int, $lineNumbers: Boolean) {
  readFileContent(workspaceSlug: $workspaceSlug, filePath: $filePath, startLine: $startLine, endLine: $endLine, lineNumbers: $lineNumbers) {
    success
    errors
    content
    size
    startLine
    endLine
    totalLines
    notice
  }
}

query GlobFiles($workspaceSlug: String!, $pattern: String!, $prefix: String) {
  globFiles(workspaceSlug: $workspaceSlug, pattern: $pattern, prefix: $prefix) {
    success
    errors
    paths
    truncated
    notice
  }
}

query GrepFiles(
  $workspaceSlug: String!
  $pattern: String!
  $glob: String!
  $prefix: String
  $outputMode: GrepOutputMode
  $ignoreCase: Boolean
  $context: Int
  $headLimit: Int
  $offset: Int
) {
  grepFiles(
    workspaceSlug: $workspaceSlug
    pattern: $pattern
    glob: $glob
    prefix: $prefix
    outputMode: $outputMode
    ignoreCase: $ignoreCase
    context: $context
    headLimit: $headLimit
    offset: $offset
  ) {
    success
    errors
    files
    content
    counts {
      path
      count
    }
    total
    truncated
    notice
  }
}

mutation WriteFileContent($input: WriteFileContentInput!) {
  writeFileContent(input: $input) {
    success
    errors
    filePath
    size
  }
}