"""
A resource that can be copied when duplicating a workspace. The workspace
itself is always created.
"""
enum WorkspaceCopyResource {
  FILES
  DATABASE
  CONNECTIONS
  PIPELINES
  DATASETS
  WEBAPPS
}

enum WorkspaceCopyRunStatus {
  QUEUED
  RUNNING
  SUCCESS
  SUCCESS_WITH_ERRORS
  FAILED
}

"""
A workspace duplication, run in the background.
"""
type WorkspaceCopyRun {
  id: UUID!
  status: WorkspaceCopyRunStatus!
  "Name requested for the new workspace."
  targetWorkspaceName: String!
  sourceWorkspaceSlug: String!
  """
  Timestamped progress lines, appended while the run is going. Pass the
  previous `nextOffset` as `offset` to get only the lines added since.
  """
  logs(offset: Int = 0): WorkspaceCopyRunLogs!
  "Why the run failed, if it did."
  error: String
  createdAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  "The workspace created by the run, once it exists."
  workspace: Workspace
}

type WorkspaceCopyRunLogs {
  "Log text from the requested offset onwards, in whole lines."
  text: String!
  "Offset to pass next time to receive only newer lines."
  nextOffset: Int!
}

input DuplicateWorkspaceInput {
  workspaceSlug: String!
  name: String!
  "Countries of the new workspace. Omitted, the source workspace's are kept."
  countries: [CountryInput!]
  resources: [WorkspaceCopyResource!]!
  includeConnectionSecrets: Boolean!
}

enum DuplicateWorkspaceError {
  WORKSPACE_NOT_FOUND
  PERMISSION_DENIED
  WORKSPACES_LIMIT_REACHED
  INVALID_COUNTRY
  "The user already has a duplication queued or running."
  COPY_ALREADY_RUNNING
}

type DuplicateWorkspaceResult {
  success: Boolean!
  errors: [DuplicateWorkspaceError!]!
  run: WorkspaceCopyRun
}

extend type Query {
  workspaceCopyRun(id: UUID!): WorkspaceCopyRun @loginRequired
  "The current user's duplication that is still queued or running, if any."
  activeWorkspaceCopyRun: WorkspaceCopyRun @loginRequired
}

extend type Mutation {
  duplicateWorkspace(input: DuplicateWorkspaceInput!): DuplicateWorkspaceResult!
    @loginRequired
}
