
extend type Workspace {
  "File storage of the workspace represented as a bucket"
  bucket: Bucket!
}

"""
The type of an object in a workspace's bucket.
"""
enum BucketObjectType {
  FILE
  DIRECTORY
}

"""
An object in a workspace's bucket.
"""
type BucketObject {
  key: String!
  name: String!
  path: String!
  size: BigInt
  updatedAt: DateTime
  type: BucketObjectType!
}

"""
A page of objects in a workspace's bucket.
"""
type BucketObjectPage {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  pageNumber: Int!
  items: [BucketObject!]!
}


"""
A bucket is where all the files and data related to a workspace are stored.
"""
type Bucket {
  name: String!
  objects(prefix: String, page: Int = 1, perPage: Int = 15, query: String, ignoreHiddenFiles: Boolean = true): BucketObjectPage!
  object(key: String!): BucketObject
}

"""
Input for deleting an object from a workspace's bucket.
"""
input DeleteBucketObjectInput {
  workspaceSlug: String!
  objectKey: String!
}

"""
Errors that can occur when deleting an object from a workspace's bucket.
"""
enum DeleteBucketObjectError {
  NOT_FOUND
  PERMISSION_DENIED
  INVALID_PATH
}

"""
The result of deleting an object from a workspace's bucket.
"""
type DeleteBucketObjectResult {
  success: Boolean!
  errors: [DeleteBucketObjectError!]!
}

input PrepareObjectDownloadInput {
  workspaceSlug: String!
  objectKey: String!
  forceAttachment: Boolean = true
}

"""
Errors that can occur when preparing to download an object from a workspace's bucket.
"""
enum PrepareObjectDownloadError {
  NOT_FOUND
  PERMISSION_DENIED
  INVALID_PATH
}

"""
The result of preparing to download an object from a workspace's bucket.
"""
type PrepareObjectDownloadResult {
  success: Boolean!
  downloadUrl: URL
  errors: [PrepareObjectDownloadError!]!
}

"""
Input for preparing to upload an object to a workspace's bucket.
The `contentType` 
"""
input PrepareObjectUploadInput {
  workspaceSlug: String!
  objectKey: String!
  contentType: String
}

"""
Errors that can occur when preparing to upload an object to a workspace's bucket.
"""
enum PrepareObjectUploadError {
  PERMISSION_DENIED
  INVALID_PATH
}

"""
The result of preparing to upload an object to a workspace's bucket. It contains a URL that can be used to upload the object using a PUT request.

"""
type PrepareObjectUploadResult {
  "Url to upload the object to. The contentType passed with the PUT request should match the one passed in the input."
  uploadUrl: URL
  headers: JSON
  success: Boolean!
  errors: [PrepareObjectUploadError!]!
}

"""
Input for creating a folder in a workspace's bucket.
"""
input CreateBucketFolderInput {
  workspaceSlug: String!
  folderKey: String!
}

"""
Errors that can occur when creating a folder in a workspace's bucket.
"""
enum CreateBucketFolderError {
  ALREADY_EXISTS
  NOT_FOUND
  PERMISSION_DENIED
  INVALID_PATH
}

"""
The result of creating a folder in a workspace's bucket.
"""
type CreateBucketFolderResult {
  success: Boolean!
  errors: [CreateBucketFolderError!]!
  folder: BucketObject
}

enum ReadFileContentError {
  NOT_FOUND
  PERMISSION_DENIED
  FILE_TOO_LARGE
  NOT_A_FILE
  NOT_UTF8
  INVALID_PATH
}

type ReadFileContentResult {
  success: Boolean!
  errors: [ReadFileContentError!]!
  content: String
  size: Int
  "First line of the returned window (1-indexed)."
  startLine: Int
  "Last line of the returned window (inclusive)."
  endLine: Int
  "Number of lines in the whole file."
  totalLines: Int
  "Set when the window is partial or empty, telling how to read on."
  notice: String
}

enum GlobFilesError {
  NOT_FOUND
  PERMISSION_DENIED
  INVALID_PATH
}

type GlobFilesResult {
  success: Boolean!
  errors: [GlobFilesError!]!
  "Matching paths, sorted, at most 100."
  paths: [String!]
  "True when more paths match than were returned."
  truncated: Boolean
  notice: String
}

"""
How grepFiles reports its matches.
"""
enum GrepOutputMode {
  "Paths of the files that match."
  FILES_WITH_MATCHES
  "Matching lines as `path:line:text`, context lines as `path-line-text`."
  CONTENT
  "Number of matches per file, and their total."
  COUNT
}

enum GrepFilesError {
  NOT_FOUND
  PERMISSION_DENIED
  INVALID_PATH
  INVALID_PATTERN
}

type GrepFileCount {
  path: String!
  count: Int!
}

type GrepFilesResult {
  success: Boolean!
  errors: [GrepFilesError!]!
  "With outputMode FILES_WITH_MATCHES."
  files: [String!]
  "With outputMode CONTENT."
  content: String
  "With outputMode COUNT."
  counts: [GrepFileCount!]
  "With outputMode COUNT: matches across all files."
  total: Int
  "True when there are more entries past headLimit, or the search stopped early."
  truncated: Boolean
  notice: String
}

input WriteFileContentInput {
  workspaceSlug: String!
  filePath: String!
  content: String!
  overwrite: Boolean = false
}

enum WriteFileContentError {
  NOT_FOUND
  PERMISSION_DENIED
  ALREADY_EXISTS
  FILE_TOO_LARGE
  INVALID_PATH
}

type WriteFileContentResult {
  success: Boolean!
  errors: [WriteFileContentError!]!
  filePath: String
  size: Int
}

extend type Mutation {
  """
  Delete an object from a workspace's bucket.
  """
  deleteBucketObject(input: DeleteBucketObjectInput!): DeleteBucketObjectResult!

  """
  Prepare to download an object from a workspace's bucket.
  """
  prepareObjectDownload(input: PrepareObjectDownloadInput!): PrepareObjectDownloadResult!
  
  """
  Prepare to upload an object to a workspace's bucket.
  """
  prepareObjectUpload(input: PrepareObjectUploadInput!): PrepareObjectUploadResult!

  """
  Create a folder in a workspace's bucket.
  """
  createBucketFolder(input: CreateBucketFolderInput!): CreateBucketFolderResult!

  """
  Write text content to a file in a workspace's bucket. Use the overwrite flag to replace an existing file.
  """
  writeFileContent(input: WriteFileContentInput!): WriteFileContentResult! @loginRequired
}

extend type Query {
  """
  Get a file by its path within a workspace.
  """
  getFileByPath(workspaceSlug: String!, path: String!): BucketObject @loginRequired

  """
  Read the text content of a file from a workspace's bucket. startLine and endLine
  (1-indexed, inclusive) select a window. lineNumbers prefixes each line with its number
  and returns at most 2000 lines, clipping lines over 2000 characters. A full read is
  limited to 1 MB files; a windowed read (a line range or lineNumbers) to 10 MB files,
  and without lineNumbers to a 1 MB window.
  """
  readFileContent(workspaceSlug: String!, filePath: String!, startLine: Int, endLine: Int, lineNumbers: Boolean = false): ReadFileContentResult! @loginRequired

  """
  Find files in a workspace's bucket by path pattern, e.g. `**/*.csv`: `*` stays within a
  directory and `**` spans any depth. prefix narrows the listing to one directory.
  Hidden files are skipped.
  """
  globFiles(workspaceSlug: String!, pattern: String!, prefix: String): GlobFilesResult! @loginRequired

  """
  Search the text files of a workspace's bucket matching `glob` with a Python regular
  expression. Every file searched is downloaded: a search stops after 50 MB or 20 seconds
  and returns what it found with a notice. Files over 1 MB are skipped. headLimit and
  offset page through the entries.
  """
  grepFiles(workspaceSlug: String!, pattern: String!, glob: String!, prefix: String, outputMode: GrepOutputMode = FILES_WITH_MATCHES, ignoreCase: Boolean = false, context: Int = 0, headLimit: Int, offset: Int = 0): GrepFilesResult! @loginRequired
}

extend type WorkspacePermissions {
  "User can create objects in the workspace's bucket."
  createObject: Boolean!
  "User can delete objects in the workspace's bucket."
  deleteObject: Boolean!
  "User can download objects from the workspace's bucket."
  downloadObject: Boolean!
}