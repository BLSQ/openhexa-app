    difficulty: easy
    notes: 'Core params: DHIS2Connection, DHIS2Widget.ORG_UNIT_LEVELS bound to it, and an
      output path. Geospatial file output.'
- name: dhis2_to_dhis2-en
  inputs:
    prompt: Build a pipeline that copies data element values from one DHIS2 instance to another.
      It needs a source and a target connection, the dataset to copy, a mapping file for the
      data elements, a configurable date range, and a dry-run mode that logs what would be
      pushed without pushing it.
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_to_dhis2
    lang: en
    source_template: dhis2_to_dhis2_data_elements
    surface_tags:
    - dhis2
    - connection
    - widget
    - dry_run
    - period
    difficulty: hard
    notes: 'Core params: TWO DHIS2Connections (source and target), a DATASETS widget bound
      to the source, a mapping file path, a date range, and a dry_run bool.'
- name: dhis2_to_dhis2-fr
  inputs:
    prompt: Développe une pipeline qui copie les valeurs de data elements d'une instance DHIS2
      vers une autre. Il faut une connexion source et une connexion cible, le dataset à copier,
      un fichier de mapping pour les data elements, une période configurable, et un mode dry-run
      qui log ce qui serait envoyé sans rien pousser.
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_to_dhis2
    lang: fr
    source_template: dhis2_to_dhis2_data_elements
    surface_tags:
    - dhis2
    - connection
    - widget
    - dry_run
    - period
    difficulty: hard
    notes: 'Core params: TWO DHIS2Connections (source and target), a DATASETS widget bound
      to the source, a mapping file path, a date range, and a dry_run bool.'
- name: era5_extract-en
  inputs:
    prompt: I want a pipeline that downloads ERA5 climate data from the Copernicus Climate
      Data Store for the area covered by a boundaries dataset, for a given variable and date
      range, storing the raw files in the workspace.
    fixture_profile: standard_workspace
  metadata:
    task_id: era5_extract
    lang: en
    source_template: era5_extract
    surface_tags:
    - era5
    - toolbox
    - custom_connection
    - dataset
    - period
    difficulty: medium
    notes: 'Core params: CustomConnection for the CDS credentials, a boundaries Dataset, a
      variable, a date range, and an output dir. Should use openhexa.toolbox.era5 rather than
      raw requests.'
