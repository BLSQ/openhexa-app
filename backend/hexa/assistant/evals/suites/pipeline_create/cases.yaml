- name: dhis2_shapes_extract-fr
  inputs:
    prompt: Créé une pipeline qui récupère les limites géographiques des org units depuis
      DHIS2 pour un niveau donné, et les écrit sous forme de fichier géospatial dans le workspace.
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_shapes_extract
    lang: fr
    source_template: dhis2_shapes_extract
    surface_tags:
    - dhis2
    - connection
