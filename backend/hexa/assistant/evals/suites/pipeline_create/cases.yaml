# Cases for the pipeline_create eval suite: run_evals --suite=pipeline_create.
# Field types are defined in schemas.py. Every case is validated by make t.

name: create-pipeline-outcome-evals
cases:
- name: build_dataset-en
  inputs:
    prompt: Create a pipeline that takes a list of file paths from the workspace and publishes
      them as a new version of an existing dataset. I should be able to pick the target dataset
      and pass one or more paths.
    fixture_profile: standard_workspace
  metadata:
    task_id: build_dataset
    lang: en
    source_template: build_dataset
    surface_tags:
    - dataset
    - files
    - parameters
    difficulty: easy
    notes: 'Core params: a Dataset parameter for the target, and a multiple=True str parameter
      for the file paths. Should create a new dataset version.'
- name: build_dataset-fr
  inputs:
    prompt: Créé une pipeline qui publie des fichiers du workspace dans un dataset existant.
      Je dois pouvoir choisir le dataset cible et indiquer un ou plusieurs chemins de fichiers,
      ajoutés comme nouvelle version.
    fixture_profile: standard_workspace
  metadata:
    task_id: build_dataset
    lang: fr
    source_template: build_dataset
    surface_tags:
    - dataset
    - files
    - parameters
    difficulty: easy
    notes: 'Core params: a Dataset parameter for the target, and a multiple=True str parameter
      for the file paths. Should create a new dataset version.'
- name: dhis2_extract_dataset-en
  inputs:
    prompt: I need a pipeline that extracts the data values of a DHIS2 dataset for a set of
      org units over a date range, and saves the result as a dataset version. Let me choose
      the DHIS2 connection, the dataset, the org units, and the start and end dates.
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_extract_dataset
    lang: en
    source_template: dhis2_extract_dataset
    surface_tags:
    - dhis2
    - connection
    - widget
    - dataset
    - period
    difficulty: medium
    notes: 'Core params: DHIS2Connection, DHIS2Widget.DATASETS and ORG_UNITS bound to that
      connection, start/end dates, and a Dataset output target.'
- name: dhis2_extract_dataset-fr
  inputs:
    prompt: J'ai besoin d'une pipeline qui extrait les valeurs d'un dataset DHIS2 pour une
      liste d'org units sur une période donnée, et sauvegarde le résultat dans un dataset
      OpenHEXA. Je veux pouvoir choisir la connexion DHIS2, le dataset, les org units et les
      dates de début et de fin.
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_extract_dataset
    lang: fr
    source_template: dhis2_extract_dataset
    surface_tags:
    - dhis2
    - connection
    - widget
    - dataset
    - period
    difficulty: medium
    notes: 'Core params: DHIS2Connection, DHIS2Widget.DATASETS and ORG_UNITS bound to that
      connection, start/end dates, and a Dataset output target.'
- name: dhis2_metadata_extract-en
  inputs:
    prompt: Write a pipeline that exports DHIS2 metadata to the workspace - org units, org
      unit groups, data elements, data element groups, datasets, category options. Each type
      optional via its own toggle, and the output folder configurable.
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_metadata_extract
    lang: en
    source_template: dhis2_metadata_extract
    surface_tags:
    - dhis2
    - connection
    - metadata
    - files
    difficulty: easy
    notes: 'Core params: DHIS2Connection plus one bool toggle per metadata type, and a configurable
      output path.'
- name: dhis2_metadata_extract-fr
  inputs:
    prompt: 'Génère une pipeline qui exporte les métadonnées d''une instance DHIS2 vers le
      workspace : org units, groupes d''org units, data elements, groupes de data elements,
      datasets et category options. Chaque type activable séparément, et le dossier de sortie
      paramétrable.'
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_metadata_extract
    lang: fr
    source_template: dhis2_metadata_extract
    surface_tags:
    - dhis2
    - connection
    - metadata
    - files
    difficulty: easy
    notes: 'Core params: DHIS2Connection plus one bool toggle per metadata type, and a configurable
      output path.'
- name: dhis2_shapes_extract-en
  inputs:
    prompt: Create a pipeline that pulls organisation unit boundaries from DHIS2 for a chosen
      org unit level and writes them as a geospatial file in the workspace.
    fixture_profile: standard_workspace
  metadata:
    task_id: dhis2_shapes_extract
    lang: en
    source_template: dhis2_shapes_extract
    surface_tags:
    - dhis2
