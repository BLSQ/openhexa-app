      .badge-low { background: #fef3c7; color: #92400e; }

    </style>

    <main class="page">
      <h1>Stock Tracker</h1>
      <section class="summary">
        <div class="card">In stock: <strong id="count-ok">0</strong></div>
        <div class="card">Low: <strong id="count-low">0</strong></div>
        <div class="card">Out: <strong id="count-out">0</strong></div>
      </section>
      <section class="toolbar">
        <input id="search" class="search" placeholder="Search items" />
        <select id="category" class="select">
          <option value="all">All categories</option>
        </select>
      </section>
      <table id="stock-table" class="table">
        <thead>

            <th>Stock</th>
            <th>Months of stock</th>
            <th>Status</th>

        </thead>
        <tbody></tbody>
      </table>
      <p id="empty" class="empty" hidden>No items match your filters.</p>
      <nav class="pager">
        <button id="prev">Previous</button>
        <span id="page-info"></span>
        <button id="next">Next</button>

    </main>

      ];

      const state = { query: '', category: 'all', page: 0 };

      function stockStatus(item) {
        if (item.stock === 0) return 'out';
        if (item.stock < LOW_STOCK_THRESHOLD) return 'low';
        return 'ok';
      }

      function monthsOfStock(item) {
        if (!item.monthly_consumption) return null;
        return (item.stock / item.monthly_consumption).toFixed(1);
      }

      function filtered() {
        return ITEMS.filter((item) => {
          const matchesQuery = item.name.toLowerCase().includes(state.query.toLowerCase());
          const matchesCategory = state.category === 'all' || item.category === state.category;
          return matchesQuery && matchesCategory;
        });
      }

      function renderSummary(items) {
        const counts = { ok: 0, low: 0, out: 0 };
        items.forEach((item) => counts[stockStatus(item)]++);
        document.getElementById('count-ok').textContent = counts.ok;
        document.getElementById('count-low').textContent = counts.low;
        document.getElementById('count-out').textContent = counts.out;
      }

      function renderTable(items) {
        const tbody = document.querySelector('#stock-table tbody');
        tbody.innerHTML = '';
        const start = state.page * PAGE_SIZE;
        items.slice(start, start + PAGE_SIZE).forEach((item) => {
          const status = stockStatus(item);
          const tr = document.createElement('tr');
          tr.className = 'row';
          tr.innerHTML = `
            <td class="cell">${item.name}</td>
            <td class="cell">${item.category}</td>
            <td class="cell">${item.stock}</td>
            <td class="cell">${monthsOfStock(item) ?? '–'}</td>
            <td class="cell"><span class="badge badge-${status}">${status}</span></td>`;
          tbody.appendChild(tr);
        });
        document.getElementById('page-info').textContent =
          `${state.page + 1} / ${Math.max(1, Math.ceil(items.length / PAGE_SIZE))}`;
      }

      function render() {
        const items = filtered();
        renderSummary(items);
        renderTable(items);
        document.getElementById('empty').hidden = items.length > 0;
      }

      function populateCategories() {
        const select = document.getElementById('category');
        [...new Set(ITEMS.map((item) => item.category))].sort().forEach((category) => {
          select.insertAdjacentHTML('beforeend', `<option>${category}</option>`);
        });
      }

      document.getElementById('search').addEventListener('input', (event) => {
        state.query = event.target.value;
        state.page = 0;
        render();
      });
      document.getElementById('category').addEventListener('change', (event) => {
        state.category = event.target.value;
        state.page = 0;
        render();
      });
      document.getElementById('prev').addEventListener('click', () => {
        state.page = Math.max(0, state.page - 1);
        render();
      });
      document.getElementById('next').addEventListener('click', () => {
        const pages = Math.ceil(filtered().length / PAGE_SIZE);
        state.page = Math.min(pages - 1, state.page + 1);
        render();
      });

      populateCategories();
      render();
