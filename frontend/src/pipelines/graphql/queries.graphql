query PipelinesPage($page: Int, $perPage: Int = 15) {
  dags(page: $page, perPage: $perPage) {
    totalPages
    totalItems
    items {
      label
      countries {
        ...CountryBadge_country
      }
      tags {
        ...Tag_tag
      }
      id
      externalId
      runs(orderBy: EXECUTION_DATE_DESC, perPage: 1) {
        items {
          id
          status
          executionDate
        }
      }
    }
  }
}

query PipelinePage($id: UUID!, $page: Int, $perPage: Int) {
  dag(id: $id) {
    id
    label
    countries {
      ...CountryBadge_country
    }
    tags {
      ...Tag_tag
    }
    externalId
    schedule
    externalUrl
    template {
      code
      description
      sampleConfig
    }
    description
    schedule
    user {
      ...UserProperty_user
    }
    runs(page: $page, perPage: $perPage) {
      totalItems
      totalPages
      items {
        id
        label
        triggerMode
        externalId
        externalUrl
        user {
          ...UserColumn_user
        }
        status
        executionDate
        lastRefreshedAt
        duration
        ...PipelineRunFavoriteTrigger_run
      }
    }
  }
}

query PipelineRunPage($pipelineId: UUID!, $runId: UUID!) {
  dagRun(id: $runId) {
    id
    label
    triggerMode
    user {
      displayName
    }
    ...PipelineRunDataCard_dagRun
  }

  dag(id: $pipelineId) {
    id
    externalId
    label
    ...PipelineRunDataCard_dag
  }
}

query PipelineConfigureRunPage($pipelineId: UUID!) {
  dag(id: $pipelineId) {
    id
    label
    externalId
    template {
      sampleConfig
      description
    }
    description
    ...PipelineRunForm_dag
  }
}
query PipelinesPicker {
  dags {
    items {
      ...PipelinesPicker_value
    }
  }
}

query PipelineRunPoller($runId: UUID!) {
  run: pipelineRun(id: $runId) {
    ...usePipelineRunPoller_run
    duration
    progress
    hasErrorMessages
  }
}
# The permalink page of a public pipeline: what a visitor needs to launch it.
query PublicPipelinePage($id: UUID!) {
  publicPipeline(id: $id) {
    id
    name
    description
    visibility
    runnable
    organizationName
    parameters {
      ...ParameterField_parameter
    }
  }
}

# Server-side only, for members who open the permalink of a pipeline that is
# not public: the Data Studio is where they work with it.
query PublicPipelineRedirect($id: UUID!) {
  pipeline(id: $id) {
    id
    code
    workspace {
      slug
    }
  }
}

query PublicPipelineRunPage($id: UUID!) {
  publicPipelineRun(id: $id) {
    id
    status
    progress
    executionDate
    duration
    config
    ...RunMessages_publicRun
    pipeline {
      id
      name
      # The same selection as the launcher: the cache unions arrays by object
      # equality when a page is hydrated, so a narrower selection here would
      # leave each parameter in the list twice.
      parameters {
        ...ParameterField_parameter
      }
    }
  }
}
