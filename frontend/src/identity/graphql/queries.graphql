query GetUser {
  me {
    hasTwoFactorEnabled
    permissions {
      adminPanel
      superUser
    }
    features {
      code
    }
    user {
      ...UserAvatar_user
      email
      id
      firstName
      lastName
      displayName
      language
      dateJoined
      analyticsEnabled
      avatar {
        initials
        color
      }
    }
  }
}

query AccountPage {
  me {
    hasTwoFactorEnabled
    user {
      firstName
      lastName
      dateJoined
      displayName
      id
      email
      language
      analyticsEnabled
      ...User_user
    }
  }

  pendingWorkspaceInvitations {
    totalItems
    items {
      id
      status
      invitedBy {
        ...User_user
      }
      role
      workspace {
        slug
        name
      }
      createdAt
    }
  }
}

query AccountAccessTokens($page: Int!, $perPage: Int!) {
  # A token lives on the membership, so workspaces the user only sees through an
  # organization admin role are excluded — they have no token there.
  workspaces(page: $page, perPage: $perPage, withCurrentMembership: true) {
    totalItems
    items {
      slug
      name
      currentMembership {
        role
      }
      permissions {
        generateToken
      }
    }
  }
}

query RegisterPage {
  config {
    passwordRequirements
    passwordLoginEnabled
    oidcProviders {
      id
      displayName
      loginUrl
    }
  }
}

query SignupPage {
  config {
    allowSelfRegistration
    passwordLoginEnabled
    oidcProviders {
      id
      displayName
      loginUrl
    }
  }
}
