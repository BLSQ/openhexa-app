query GetUser {
  me {
    hasTwoFactorEnabled
    permissions {
      adminPanel
      superUser
    }
    features {
      code
    }
    user {
      ...UserAvatar_user
      email
      id
      firstName
      lastName
      displayName
      language
      dateJoined
      analyticsEnabled
      avatar {
        initials
        color
      }
    }
  }
}

query AccountPage {
  me {
    hasTwoFactorEnabled
    user {
      firstName
      lastName
      dateJoined
      displayName
      id
      email
      language
      analyticsEnabled
      ...User_user
    }
  }

  # Access tokens are listed as a flat list, capped at 100 workspaces: the grid
  # paginates client-side and users are not expected to exceed that.
  workspaces(page: 1, perPage: 100) {
    totalItems
    items {
      slug
      name
      currentMembership {
        role
      }
      permissions {
        generateToken
      }
    }
  }

  pendingWorkspaceInvitations {
    totalItems
    items {
      id
      status
      invitedBy {
        ...User_user
      }
      role
      workspace {
        slug
        name
      }
      createdAt
    }
  }
}

query RegisterPage {
  config {
    passwordRequirements
    passwordLoginEnabled
    oidcProviders {
      id
      displayName
      loginUrl
    }
  }
}

query SignupPage {
  config {
    allowSelfRegistration
    passwordLoginEnabled
    oidcProviders {
      id
      displayName
      loginUrl
    }
  }
}
