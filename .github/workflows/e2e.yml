name: E2E

# Regression check against a deployed environment. Run this against demo before
# promoting a release to production.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Environment to test"
        required: true
        default: "https://app.demo.openhexa.org"
        type: string
  schedule:
    # Every day at 05:00 UTC, so a broken demo environment is noticed before
    # anyone reaches for it.
    - cron: "0 5 * * *"

concurrency:
  # A single shared test account: never run two suites against it at once.
  group: e2e-${{ inputs.base_url || 'https://app.demo.openhexa.org' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      CI: true
      E2E_BASE_URL: ${{ inputs.base_url || 'https://app.demo.openhexa.org' }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_OUTSIDER_EMAIL: ${{ secrets.E2E_OUTSIDER_EMAIL }}
      E2E_OUTSIDER_PASSWORD: ${{ secrets.E2E_OUTSIDER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run the suite
        run: npx playwright test
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
