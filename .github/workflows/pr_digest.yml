name: pr_digest
run-name: Digest PR #${{ inputs.pr || github.event.issue.number }}

# On demand only: comment `/digest` on a pull request (needs write access to
# the repository), or run this workflow from the Actions tab.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to digest"
        required: true
      model:
        description: "Claude model override (default: the CLAUDE_MODEL repo variable)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write # reacting to the /digest comment
  id-token: write # required for the GCP Workload Identity Federation OIDC exchange

concurrency:
  group: pr-digest-${{ inputs.pr || github.event.issue.number }}
  cancel-in-progress: true

env:
  PR: ${{ inputs.pr || github.event.issue.number }}
  MODEL: ${{ inputs.model || vars.CLAUDE_MODEL || 'claude-opus-4-6' }}

jobs:
  digest:
    name: Digest the pull request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/digest'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # issue_comment runs with the repository's secrets, so anyone able to
      # comment must not be able to spend them.
      - name: Check the commenter can write to the repository
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::${{ github.event.comment.user.login }} has '$permission' access; /digest needs write access."; exit 1 ;;
          esac
          gh api --method POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null

      - name: Checkout the pull request head
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.PR }}/head

      - name: Resolve the head SHA
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run the pr-digest skill
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_ML_REGION: europe-west1
          # So `gh` inside Claude's Bash tool acts as blsqbot.
          GH_TOKEN: ${{ secrets.BLSQBOT_TOKEN }}
          # Telemetry -> Logfire (events + metrics + traces over OTLP; token is
          # a Logfire write token, passed bare with no Bearer prefix).
          CLAUDE_CODE_ENABLE_TELEMETRY: "1"
          # Tracing is beta: span trees per interaction (llm_request spans carry
          # model, tokens, stop_reason, ttft) — the schema may shift between
          # claude-code-action versions.
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: https://logfire-eu.pydantic.dev
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=${{ secrets.LOGFIRE_WRITE_TOKEN }}
          OTEL_SERVICE_NAME: pr-digest
          OTEL_RESOURCE_ATTRIBUTES: gh.run_id=${{ github.run_id }},gh.pr=${{ env.PR }},gh.model=${{ env.MODEL }}
          OTEL_METRIC_EXPORT_INTERVAL: "10000"
          # Prompts and responses carry this repository's source; left redacted.
          # Set these to "1" to see full content in Logfire.
          OTEL_LOG_TOOL_DETAILS: "0"
          OTEL_LOG_USER_PROMPTS: "0"
          OTEL_LOG_ASSISTANT_RESPONSES: "0"
        with:
          use_vertex: "true"
          github_token: ${{ secrets.BLSQBOT_TOKEN }}
          # The digest comes back as structured output and is posted by the
          # next step, so the action's own tracking/sticky comments (which only
          # support pull_request and issues events) stay out of the way.
          claude_args: >-
            --model ${{ env.MODEL }}
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(printf:*),Bash(sha256sum:*)"
            --json-schema '{"type":"object","properties":{"digest":{"type":"string"}},"required":["digest"]}'
          prompt: |
            Digest pull request #${{ env.PR }}
            so a reviewer can go straight to what matters.

            Follow .claude/skills/pr-digest/SKILL.md exactly, including its
            "Running in CI" section.

            Context already established — do not spend turns re-verifying it:
            - REPO: ${{ github.repository }}
            - PR NUMBER: ${{ env.PR }}
            - PR URL, for the diff links: ${{ github.server_url }}/${{ github.repository }}/pull/${{ env.PR }}
            - Head SHA, for the fallback links: ${{ steps.head.outputs.sha }}
            - The PR head is checked out in the working directory.

      - name: Post or update the digest comment
        env:
          GH_TOKEN: ${{ secrets.BLSQBOT_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          marker='<!-- pr-digest -->'
          digest=$(jq -r '.digest' <<< "$STRUCTURED_OUTPUT")
          body=$(printf '%s\n%s\n\n<sub>Digest of %s · comment `/digest` to refresh</sub>\n' "$marker" "$digest" "${HEAD_SHA:0:7}")
          existing=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"$marker\"))) | last | .id // empty" | tail -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body" >/dev/null
          fi
